<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS2 AI 副驾 · 桌宠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    /* 色键品红：与 poc.py 的 CHROMA_HEX 一致，Win32 会把这颜色抠成透明。
       页面里严禁出现其他品红元素。 */
    background: #FE00FE;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none;
  }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }

  /* 字幕气泡 */
  #bubble {
    position: absolute;
    left: 50%;
    top: 4px;
    transform: translateX(-50%);
    max-width: 86%;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.94);
    color: #1a1a2e;
    border-radius: 16px;
    font-size: 16px;
    line-height: 1.5;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -8px;
    transform: translateX(-50%);
    border: 8px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.94);
    border-bottom: none;
  }

  /* 状态提示（POC 用，正式版移除） */
  #status {
    position: absolute;
    left: 8px;
    bottom: 8px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(0, 0, 0, 0.45);
    padding: 3px 10px;
    border-radius: 8px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="bubble"></div>
  <div id="status">加载中…</div>

  <!-- pixi.js（本地优先，CDN 兜底） -->
  <script src="./vendor/pixi.min.js"></script>
  <script>
    // 本地 pixi 没加载成功则回退 CDN
    if (typeof PIXI === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"><\/script>');
    }
  </script>

  <!-- Live2D Cubism Core（本地优先，CDN 兜底） -->
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script>
    if (typeof Live2DCubismCore === "undefined") {
      document.write('<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"><\/script>');
    }
  </script>

  <!-- pixi-live2d-display（Cubism4 运行时，本地优先，CDN 兜底） -->
  <script src="./vendor/pixi-live2d-display-cubism4.min.js"></script>
  <script>
    if (typeof PIXI !== "undefined" && typeof PIXI.live2d === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"><\/script>');
    }
  </script>

  <script>
    // ============ 配置 ============
    // 模型候选列表（按顺序尝试，第一个加载成功的生效）
    // 1. DS 鲸鱼娘：DeepSeek 鲸鱼娘二创（B站@氵六青 制作，CC BY-NC-SA 4.0，免费非商业）
    // 2. Hiyori / 3. Haru：Live2D 官方免费示例模型
    const MODEL_CANDIDATES = [
      "./models/WhaleGirl/c_0120.model3.json",
      "./models/Hiyori/Hiyori.model3.json",
      "./models/Haru/Haru.model3.json",
    ];

    let app = null;          // PIXI Application
    let live2dModel = null;  // Live2DModel 实例
    let isSpeaking = false;
    let mouthOpen = 0;       // 0~1 嘴部开合
    let bubbleTimer = null;

    const stage = document.getElementById("stage");
    const bubble = document.getElementById("bubble");
    const statusEl = document.getElementById("status");

    function setStatus(t) { statusEl.textContent = t; }

    // ============ 初始化 PIXI ============
    function initPixi() {
      app = new PIXI.Application({
        view: document.createElement("canvas"),
        backgroundAlpha: 0,          // 透明背景
        autoStart: true,
        resizeTo: stage,
        antialias: true,
      });
      stage.appendChild(app.view);
    }

    // ============ 加载 Live2D 模型 ============
    async function loadModel() {
      const { Live2DModel } = PIXI.live2d;
      setStatus("加载模型…");
      let model = null;
      for (const path of MODEL_CANDIDATES) {
        try {
          model = await Live2DModel.from(path);
          console.log("[pet] 模型加载成功:", path);
          break;
        } catch (e) {
          console.warn("[pet] 模型不可用:", path, e);
        }
      }
      if (!model) {
        setStatus("无可用模型（检查 models/ 目录）");
        throw new Error("所有模型候选都加载失败");
      }
      live2dModel = model;
      app.stage.addChild(model);

      // ===== 布局（想调人物大小/位置改这里）=====
      // 展示全身：让整个模型（含脚）都收进窗口，头顶给字幕气泡留空间
      const bubbleSpace = 0.16;                          // 顶部留 16% 高度给气泡
      const availableH = app.view.height * (1 - bubbleSpace);
      const availableW = app.view.width * 0.94;
      const scale = Math.min(availableW / model.width, availableH / model.height);
      model.scale.set(scale);
      model.anchor.set(0.5, 0.5);                        // 以中心为锚，等比例缩放不偏移
      model.x = app.view.width / 2;
      model.y = app.view.height * (bubbleSpace + (1 - bubbleSpace) / 2);

      setStatus("模型已加载 ✓");

      // 呼吸参数（Haru 模型自带呼吸，此处留空，可选增强）
      startMouthLoop();
    }

    // ============ 嘴型动画（简单张合，非口型同步） ============
    function startMouthLoop() {
      function tick() {
        if (live2dModel && live2dModel.internalModel) {
          const core = live2dModel.internalModel.coreModel;
          if (isSpeaking) {
            // 伪随机张合，模拟说话
            const t = Date.now() / 160;
            const wave = (Math.sin(t) + Math.sin(t * 1.7) + Math.sin(t * 2.3)) / 3;
            mouthOpen = 0.45 + 0.55 * Math.max(0, wave);
          } else {
            mouthOpen = Math.max(0, mouthOpen - 0.1); // 平滑闭合
          }
          try {
            core.setParameterValueById("ParamMouthOpenY", mouthOpen);
          } catch (e) {}
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // ============ 字幕 ============
    function showBubble(text) {
      if (!text) return;
      bubble.textContent = text;
      bubble.classList.add("show");
      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 5000);
    }

    // ============ 事件轮询（Python -> JS） ============
    function pollEvents() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.drain_events()
          .then((events) => {
            if (events && events.length) handleEvents(events);
          })
          .catch((e) => { setStatus("事件通道错误"); console.error(e); });
      }
      setTimeout(pollEvents, 100);
    }

    function handleEvents(events) {
      for (const ev of events) {
        switch (ev.type) {
          case "speak_start":
            isSpeaking = true;
            showBubble(ev.text || "");
            setStatus("说话中…");
            break;
          case "speak_stop":
            isSpeaking = false;
            setStatus("待机");
            break;
          case "emotion":
            // 阶段 0 仅记录，阶段 1 接表情切换
            console.log("[emotion]", ev.value);
            break;
        }
      }
    }

    // ============ 启动 ============
    window.addEventListener("DOMContentLoaded", async () => {
      if (typeof PIXI === "undefined" || !PIXI.live2d || !PIXI.live2d.Live2DModel) {
        setStatus("SDK 未就绪：请检查 vendor/ 下的依赖文件");
        console.error("pixi 或 pixi-live2d-display 未加载");
        return;
      }
      try {
        initPixi();
        await loadModel();
      } catch (e) {
        setStatus("模型加载失败");
        console.error("加载失败:", e);
      }
      pollEvents();
    });
  </script>
</body>
</html>
