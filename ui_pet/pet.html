<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS2 AI 副驾 · 桌宠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none;
  }
  body.card-mode {
    background: linear-gradient(160deg, #232338 0%, #1B1B2A 55%, #14141f 100%);
    border-radius: 20px;
  }
  .pywebview-drag-region { }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }

  /* 字幕气泡 */
  #bubble {
    position: absolute;
    left: 50%;
    top: 6px;
    transform: translateX(-50%);
    max-width: 88%;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.95);
    color: #1a1a2e;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.45;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.95);
    border-bottom: none;
  }

  /* 右键菜单 */
  #menu {
    position: fixed;
    display: none;
    min-width: 168px;
    max-height: 92vh;
    overflow-y: auto;
    background: rgba(30, 30, 46, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 6px;
    z-index: 100;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
  #menu .menu-title {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.45);
    padding: 5px 10px 3px;
  }
  #menu .menu-item {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.92);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  #menu .menu-item:hover { background: rgba(255, 255, 255, 0.12); }
  #menu .menu-item.active { color: #7ab8ff; }
  #menu .menu-sep {
    height: 1px;
    background: rgba(255, 255, 255, 0.12);
    margin: 5px 6px;
  }
  #menu .menu-item.danger:hover { background: rgba(255, 80, 80, 0.25); }

  /* 状态提示（POC 用，正式版移除） */
  #status {
    position: absolute;
    left: 8px;
    bottom: 8px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 9px;
    border-radius: 7px;
    pointer-events: none;
    z-index: 10;
    max-width: 92%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body class="pywebview-drag-region">
  <div id="stage" class="pywebview-drag-region"></div>
  <div id="bubble"></div>
  <div id="status">加载中…</div>
  <div id="menu"></div>

  <!-- pixi.js（本地优先，CDN 兜底） -->
  <script src="./vendor/pixi.min.js"></script>
  <script>
    if (typeof PIXI === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"><\/script>');
    }
  </script>

  <!-- Live2D Cubism Core（本地优先，CDN 兜底） -->
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script>
    if (typeof Live2DCubismCore === "undefined") {
      document.write('<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"><\/script>');
    }
  </script>

  <!-- pixi-live2d-display（Cubism4 运行时，本地优先，CDN 兜底） -->
  <script src="./vendor/pixi-live2d-display-cubism4.min.js"></script>
  <script>
    if (typeof PIXI !== "undefined" && typeof PIXI.live2d === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"><\/script>');
    }
  </script>

  <script>
    // 窗口形态：?mode=transparent（Qt 透明）| ?mode=card（卡片兜底，默认）
    if (new URLSearchParams(location.search).get("mode") !== "transparent") {
      document.body.classList.add("card-mode");
    }
  </script>

  <script>
    // ============ 模型注册表（可切换形象清单） ============
    const MODEL_REGISTRY = [
      { id: "WhaleGirl", name: "鲸鱼娘",     emoji: "🐳", path: "./models/WhaleGirl/c_0120.model3.json" },
      { id: "Mao",       name: "Mao 猫娘",   emoji: "🐱", path: "./models/Mao/Mao.model3.json" },
      { id: "Natori",    name: "Natori",     emoji: "🌸", path: "./models/Natori/Natori.model3.json" },
      { id: "Hiyori",    name: "Hiyori",     emoji: "🎀", path: "./models/Hiyori/Hiyori.model3.json" },
      { id: "Haru",      name: "Haru",       emoji: "💙", path: "./models/Haru/Haru.model3.json" },
      { id: "Ren",       name: "Ren",        emoji: "✨", path: "./models/Ren/Ren.model3.json" },
      { id: "Rice",      name: "Rice 米团子", emoji: "🍙", path: "./models/Rice/Rice.model3.json" },
      { id: "Wanko",     name: "Wanko 小狗", emoji: "🐶", path: "./models/Wanko/Wanko.model3.json" },
      { id: "Mark",      name: "Mark",       emoji: "👦", path: "./models/Mark/Mark.model3.json" },
      { id: "DeepSeekChan", name: "大肥鱼",   emoji: "🐋", path: "./models/DeepSeekChan/model3.json" },
    ];

    let app = null;              // PIXI Application
    let live2dModel = null;      // Live2DModel 实例
    let currentModelId = null;   // 当前模型 id
    let isSpeaking = false;
    let mouthOpen = 0;
    let lipParam = null;         // 嘴型参数名（随模型自适应）
    let bubbleTimer = null;
    let idleTimer = null;

    let motionGroups = [];       // 当前模型可用动作组名
    let expressionNames = [];    // 当前模型可用表情名

    let personaList = [];        // 可用人设 [{name, display, emoji, current}]
    let currentPersona = null;   // 当前人设 name

    const stage = document.getElementById("stage");
    const bubble = document.getElementById("bubble");
    const statusEl = document.getElementById("status");
    const menuEl = document.getElementById("menu");

    function setStatus(t) { statusEl.textContent = t; }

    // ============ 初始化 PIXI ============
    function initPixi() {
      app = new PIXI.Application({
        view: document.createElement("canvas"),
        backgroundAlpha: 0,
        autoStart: true,
        resizeTo: stage,
        antialias: true,
      });
      stage.appendChild(app.view);
    }

    // ============ 加载指定模型 ============
    async function loadModel(path, modelId) {
      const { Live2DModel } = PIXI.live2d;
      setStatus("加载模型…");
      // 先加载新模型，成功后再替换旧的（失败不破坏当前显示）
      const model = await Live2DModel.from(path, { motionPreload: "ALL" });
      if (live2dModel) {
        try { app.stage.removeChild(live2dModel); live2dModel.destroy(); } catch (e) {}
      }
      live2dModel = model;
      currentModelId = modelId;
      app.stage.addChild(model);

      layoutModel();
      updateBubblePosition();
      await dumpModelAssets(path);
      buildMenu();

      const name = (MODEL_REGISTRY.find(x => x.id === modelId) || {}).name || modelId;
      setStatus("✓ " + name);
      console.log("[pet] 模型已加载:", name, "动作组:", motionGroups);
      startIdleShowcase();
    }

    function layoutModel() {
      const model = live2dModel;
      const bubbleSpace = 0.14;
      const availableH = app.view.height * (1 - bubbleSpace);
      const availableW = app.view.width * 0.96;
      const scale = Math.min(availableW / model.width, availableH / model.height);
      model.scale.set(scale);
      model.anchor.set(0.5, 0.5);
      model.x = app.view.width / 2;
      model.y = app.view.height * (bubbleSpace + (1 - bubbleSpace) / 2);
    }

    // ============ 解析动作 / 表情 / 嘴型参数 ============
    async function dumpModelAssets(path) {
      motionGroups = [];
      expressionNames = [];
      lipParam = null;
      try {
        const res = await fetch(path);
        const json = await res.json();
        const fr = json.FileReferences || {};
        motionGroups = Object.keys(fr.Motions || {});
        expressionNames = (fr.Expressions || []).map(e => e.Name).filter(Boolean);
        const lip = (json.Groups || []).find(g => g.Name === "LipSync");
        lipParam = (lip && lip.Ids && lip.Ids[0]) || null;
        console.log("[pet] 动作组:", motionGroups, "| 表情:", expressionNames.length, "个 | 嘴型参数:", lipParam);
      } catch (e) { console.warn("[pet] 解析 model3.json 失败:", e); }
    }

    // ============ 播放动作 / 切换表情 ============
    function playMotion(group, index) {
      if (!live2dModel || !group) return;
      try {
        const ok = live2dModel.motion(group, index);
        if (ok && ok.then) {
          ok.then(started => {
            if (!started) console.warn("[pet] motion 未启动:", group);
          }).catch(err => console.error("[pet] motion 异常:", group, err));
        }
      } catch (e) { console.error("[pet] 播放动作异常:", group, e); }
    }

    function setExpression(name) {
      if (!live2dModel) return;
      try { live2dModel.expression(name); }
      catch (e) { console.warn("[pet] 切换表情失败:", name, e); }
    }

    // 可爱动作轮播：循环播放当前模型的动作组（切换模型后自动适配）
    function startIdleShowcase() {
      if (idleTimer) clearTimeout(idleTimer);
      let idx = 0;
      function loop() {
        if (live2dModel && !isSpeaking && motionGroups.length) {
          playMotion(motionGroups[idx % motionGroups.length]);
          idx++;
        }
        idleTimer = setTimeout(loop, 6000);
      }
      idleTimer = setTimeout(loop, 3000);
    }

    // ============ 右键菜单（动态生成） ============
    function buildMenu() {
      menuEl.innerHTML = "";

      // 切换形象区
      const t2 = document.createElement("div");
      t2.className = "menu-title";
      t2.textContent = "切换形象";
      menuEl.appendChild(t2);

      MODEL_REGISTRY.forEach(m => {
        const item = document.createElement("div");
        item.className = "menu-item model-item" + (m.id === currentModelId ? " active" : "");
        item.dataset.model = m.id;
        item.textContent = m.emoji + " " + m.name;
        item.addEventListener("click", () => {
          menuEl.style.display = "none";
          switchModel(m.id);
        });
        menuEl.appendChild(item);
      });

      const sep2 = document.createElement("div");
      sep2.className = "menu-sep";
      menuEl.appendChild(sep2);

      // 切换人设区（由主程序推送清单；空则隐藏）
      if (personaList.length) {
        const t3 = document.createElement("div");
        t3.className = "menu-title";
        t3.textContent = "切换人设";
        menuEl.appendChild(t3);

        personaList.forEach(p => {
          const item = document.createElement("div");
          item.className = "menu-item persona-item" + (p.name === currentPersona ? " active" : "");
          item.dataset.persona = p.name;
          item.textContent = (p.emoji || "🎭") + " " + (p.display || p.name);
          item.addEventListener("click", () => {
            menuEl.style.display = "none";
            switchPersona(p.name);
          });
          menuEl.appendChild(item);
        });

        const sep3 = document.createElement("div");
        sep3.className = "menu-sep";
        menuEl.appendChild(sep3);
      }

      const quit = document.createElement("div");
      quit.className = "menu-item danger";
      quit.textContent = "✕ 退出";
      quit.addEventListener("click", () => {
        if (window.pywebview && window.pywebview.api) window.pywebview.api.quit_app();
      });
      menuEl.appendChild(quit);
    }

    // 切换人设：通知主程序（通过 stdout 反向通道），主程序切换后回推确认
    async function switchPersona(name) {
      if (!window.pywebview || !window.pywebview.api) return;
      try {
        const r = await window.pywebview.api.switch_persona(name);
        if (r && r.ok) {
          currentPersona = name;
          // 立即更新菜单高亮
          personaList.forEach(p => p.current = (p.name === name));
          buildMenu();
          setStatus("人设 → " + (r.name || name));
          setTimeout(() => { if (currentModelId) setStatus("✓ " + currentModelId); }, 2500);
        } else {
          console.warn("[pet] 切换人设失败:", r);
          setStatus("人设切换失败");
        }
      } catch (e) {
        console.error("[pet] 切换人设异常:", e);
      }
    }

    let switching = false;
    async function switchModel(id) {
      if (switching || id === currentModelId) return;
      const m = MODEL_REGISTRY.find(x => x.id === id);
      if (!m) return;
      switching = true;
      setStatus("切换形象: " + m.name + "…");
      try {
        await loadModel(m.path, m.id);
      } catch (e) {
        setStatus("切换失败（详见控制台）");
        console.error("[pet] 切换失败:", id, e);
      }
      switching = false;
    }

    // 右键菜单定位
    document.addEventListener("contextmenu", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      menuEl.style.visibility = "hidden";
      menuEl.style.display = "block";
      const mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
      let x = ev.clientX, y = ev.clientY;
      if (x + mw > window.innerWidth - 4) x = window.innerWidth - mw - 4;
      if (y + mh > window.innerHeight - 4) y = window.innerHeight - mh - 4;
      menuEl.style.left = Math.max(4, x) + "px";
      menuEl.style.top = Math.max(4, y) + "px";
      menuEl.style.visibility = "visible";
    });
    document.addEventListener("mousedown", (ev) => {
      if (!menuEl.contains(ev.target)) menuEl.style.display = "none";
    });

    // ============ 嘴型动画（简单张合，非口型同步） ============
    function startMouthLoop() {
      function tick() {
        if (live2dModel && live2dModel.internalModel) {
          const core = live2dModel.internalModel.coreModel;
          if (isSpeaking) {
            const t = Date.now() / 160;
            const wave = (Math.sin(t) + Math.sin(t * 1.7) + Math.sin(t * 2.3)) / 3;
            mouthOpen = 0.45 + 0.55 * Math.max(0, wave);
          } else {
            mouthOpen = Math.max(0, mouthOpen - 0.1);
          }
          if (lipParam) {
            try { core.setParameterValueById(lipParam, mouthOpen); } catch (e) {}
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // ============ 字幕 ============
    function updateBubblePosition() {
      if (!live2dModel) return;
      try {
        const bounds = live2dModel.getBounds();
        const headY = bounds.y + bounds.height * 0.04;
        bubble.style.top = Math.max(4, headY) + "px";
      } catch (e) {}
    }

    function showBubble(text) {
      if (!text) return;
      bubble.textContent = text;
      bubble.classList.add("show");
      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 5000);
    }

    // ============ 事件轮询（Python -> JS） ============
    function pollEvents() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.drain_events()
          .then((events) => { if (events && events.length) handleEvents(events); })
          .catch((e) => { setStatus("事件通道错误"); console.error(e); });
      }
      setTimeout(pollEvents, 100);
    }

    function handleEvents(events) {
      for (const ev of events) {
        switch (ev.type) {
          case "speak_start":
            isSpeaking = true;
            showBubble(ev.text || "");
            break;
          case "speak_stop":
            isSpeaking = false;
            break;
          case "emotion":
            applyEmotion(ev.value);
            break;
          case "personas":
            personaList = ev.personas || [];
            currentPersona = personaList.find(p => p.current)?.name || null;
            buildMenu();
            break;
        }
      }
    }

    // 情绪 → 表情名候选（按顺序取当前模型真实存在的第一个）
    const EMOTION_MAP = {
      "happy":     ["开心兴奋", "爱心眼", "脸红", "Smile", "exp_01"],
      "angry":     ["angry", "Angry", "屑屑眼", "exp_02"],
      "sad":       ["悲伤", "流泪", "黑脸", "Sad", "exp_04"],
      "surprised": ["星星眼", "圈圈眼", "＞＜眼", "Surprised", "exp_05"],
      "calm":      [],
      "idle":      [],
    };
    function applyEmotion(emotion) {
      if (!live2dModel) return;
      const candidates = EMOTION_MAP[emotion];
      if (candidates) {
        if (!candidates.length) { setExpression(null); return; }
        const hit = candidates.find(n => expressionNames.includes(n));
        setExpression(hit || null);
      }
    }

    // ============ 启动 ============
    window.addEventListener("DOMContentLoaded", async () => {
      if (typeof PIXI === "undefined" || !PIXI.live2d || !PIXI.live2d.Live2DModel) {
        setStatus("SDK 未就绪：请检查 vendor/ 下的依赖文件");
        console.error("pixi 或 pixi-live2d-display 未加载");
        return;
      }
      try {
        initPixi();
        startMouthLoop();
        buildMenu();
        // 依次尝试注册表里的模型，第一个成功即用
        for (const m of MODEL_REGISTRY) {
          try { await loadModel(m.path, m.id); break; }
          catch (e) { console.warn("[pet] 模型不可用:", m.id, e); }
        }
        if (!live2dModel) setStatus("无可用模型（检查 models/ 目录）");
      } catch (e) {
        setStatus("模型加载失败");
        console.error("加载失败:", e);
      }
      pollEvents();
    });
  </script>
</body>
</html>
