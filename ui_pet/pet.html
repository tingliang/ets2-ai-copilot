<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETS2 AI 副驾 · 桌宠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    /* 默认透明背景（Qt 透明窗口模式）；卡片模式由 .card-mode 切换 */
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none;
  }
  /* 卡片模式（无 PySide6 时的兜底形态）：深色渐变圆角 */
  body.card-mode {
    background: linear-gradient(160deg, #232338 0%, #1B1B2A 55%, #14141f 100%);
    border-radius: 20px;
  }
  /* 整个窗口可拖动（pywebview 官方拖动区域） */
  .pywebview-drag-region { }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; }

  /* 字幕气泡 */
  #bubble {
    position: absolute;
    left: 50%;
    top: 6px;
    transform: translateX(-50%);
    max-width: 88%;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.95);
    color: #1a1a2e;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.45;
    box-shadow: 0 3px 14px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: rgba(255, 255, 255, 0.95);
    border-bottom: none;
  }

  /* 状态提示（POC 用，正式版移除） */
  #status {
    position: absolute;
    left: 8px;
    bottom: 8px;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 9px;
    border-radius: 7px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body class="pywebview-drag-region">
  <div id="stage" class="pywebview-drag-region"></div>
  <div id="bubble"></div>
  <div id="status">加载中…</div>

  <!-- pixi.js（本地优先，CDN 兜底） -->
  <script src="./vendor/pixi.min.js"></script>
  <script>
    // 本地 pixi 没加载成功则回退 CDN
    if (typeof PIXI === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"><\/script>');
    }
  </script>

  <!-- Live2D Cubism Core（本地优先，CDN 兜底） -->
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script>
    if (typeof Live2DCubismCore === "undefined") {
      document.write('<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"><\/script>');
    }
  </script>

  <!-- pixi-live2d-display（Cubism4 运行时，本地优先，CDN 兜底） -->
  <script src="./vendor/pixi-live2d-display-cubism4.min.js"></script>
  <script>
    if (typeof PIXI !== "undefined" && typeof PIXI.live2d === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"><\/script>');
    }
  </script>

  <script>
    // 窗口形态：?mode=transparent（Qt 透明）| ?mode=card（卡片兜底，默认）
    if (new URLSearchParams(location.search).get("mode") !== "transparent") {
      document.body.classList.add("card-mode");
    }
  </script>

  <script>
    // ============ 配置 ============
    // 模型候选列表（按顺序尝试，第一个加载成功的生效）
    // 1. DS 鲸鱼娘：DeepSeek 鲸鱼娘二创（B站@氵六青 制作，CC BY-NC-SA 4.0，免费非商业）
    // 2. Hiyori / 3. Haru：Live2D 官方免费示例模型
    const MODEL_CANDIDATES = [
      "./models/WhaleGirl/c_0120.model3.json",
      "./models/Hiyori/Hiyori.model3.json",
      "./models/Haru/Haru.model3.json",
    ];

    let app = null;          // PIXI Application
    let live2dModel = null;  // Live2DModel 实例
    let isSpeaking = false;
    let mouthOpen = 0;       // 0~1 嘴部开合
    let bubbleTimer = null;

    const stage = document.getElementById("stage");
    const bubble = document.getElementById("bubble");
    const statusEl = document.getElementById("status");

    function setStatus(t) { statusEl.textContent = t; }

    // ============ 初始化 PIXI ============
    function initPixi() {
      app = new PIXI.Application({
        view: document.createElement("canvas"),
        backgroundAlpha: 0,          // 透明背景
        autoStart: true,
        resizeTo: stage,
        antialias: true,
      });
      stage.appendChild(app.view);
    }

    // ============ 加载 Live2D 模型 ============
    async function loadModel() {
      const { Live2DModel } = PIXI.live2d;
      setStatus("加载模型…");
      let model = null;
      for (const path of MODEL_CANDIDATES) {
        try {
          model = await Live2DModel.from(path);
          console.log("[pet] 模型加载成功:", path);
          break;
        } catch (e) {
          console.warn("[pet] 模型不可用:", path, e);
        }
      }
      if (!model) {
        setStatus("无可用模型（检查 models/ 目录）");
        throw new Error("所有模型候选都加载失败");
      }
      live2dModel = model;
      app.stage.addChild(model);

      // ===== 布局（想调人物大小/位置改这里）=====
      // 展示全身：让整个模型（含脚）都收进窗口，顶部留出气泡空间
      const bubbleSpace = 0.14;                          // 顶部留 14% 高度给气泡
      const availableH = app.view.height * (1 - bubbleSpace);
      const availableW = app.view.width * 0.96;
      const scale = Math.min(availableW / model.width, availableH / model.height);
      model.scale.set(scale);
      model.anchor.set(0.5, 0.5);                        // 以中心为锚，等比例缩放不偏移
      model.x = app.view.width / 2;
      model.y = app.view.height * (bubbleSpace + (1 - bubbleSpace) / 2);

      // 气泡贴头：把字幕气泡定位到人物头顶
      updateBubblePosition();
      window.addEventListener("resize", updateBubblePosition);

      setStatus("模型已加载 ✓");

      // 呼吸参数（Haru 模型自带呼吸，此处留空，可选增强）
      startMouthLoop();
    }

    // ============ 嘴型动画（简单张合，非口型同步） ============
    function startMouthLoop() {
      function tick() {
        if (live2dModel && live2dModel.internalModel) {
          const core = live2dModel.internalModel.coreModel;
          if (isSpeaking) {
            // 伪随机张合，模拟说话
            const t = Date.now() / 160;
            const wave = (Math.sin(t) + Math.sin(t * 1.7) + Math.sin(t * 2.3)) / 3;
            mouthOpen = 0.45 + 0.55 * Math.max(0, wave);
          } else {
            mouthOpen = Math.max(0, mouthOpen - 0.1); // 平滑闭合
          }
          try {
            core.setParameterValueById("ParamMouthOpenY", mouthOpen);
          } catch (e) {}
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // ============ 字幕 ============
    // 气泡贴头：把气泡顶部定位到人物头部上方（取模型包围盒顶端附近）
    function updateBubblePosition() {
      if (!live2dModel) return;
      try {
        const bounds = live2dModel.getBounds();
        // 包围盒顶端 + 少量下移（对准头顶而非发梢最高点）
        const headY = bounds.y + bounds.height * 0.04;
        bubble.style.top = Math.max(4, headY) + "px";
      } catch (e) { /* 忽略，保持 CSS 默认位置 */ }
    }

    function showBubble(text) {
      if (!text) return;
      bubble.textContent = text;
      bubble.classList.add("show");
      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 5000);
    }

    // ============ 事件轮询（Python -> JS） ============
    function pollEvents() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.drain_events()
          .then((events) => {
            if (events && events.length) handleEvents(events);
          })
          .catch((e) => { setStatus("事件通道错误"); console.error(e); });
      }
      setTimeout(pollEvents, 100);
    }

    function handleEvents(events) {
      for (const ev of events) {
        switch (ev.type) {
          case "speak_start":
            isSpeaking = true;
            showBubble(ev.text || "");
            setStatus("说话中…");
            break;
          case "speak_stop":
            isSpeaking = false;
            setStatus("待机");
            break;
          case "emotion":
            // 阶段 0 仅记录，阶段 1 接表情切换
            console.log("[emotion]", ev.value);
            break;
        }
      }
    }

    // ============ 启动 ============
    window.addEventListener("DOMContentLoaded", async () => {
      if (typeof PIXI === "undefined" || !PIXI.live2d || !PIXI.live2d.Live2DModel) {
        setStatus("SDK 未就绪：请检查 vendor/ 下的依赖文件");
        console.error("pixi 或 pixi-live2d-display 未加载");
        return;
      }
      try {
        initPixi();
        await loadModel();
      } catch (e) {
        setStatus("模型加载失败");
        console.error("加载失败:", e);
      }
      pollEvents();
    });
  </script>
</body>
</html>
